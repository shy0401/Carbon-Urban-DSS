map "$request_method:$http_sec_fetch_site" $cross_site_write {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):(cross-site|same-site)$ 1;
}

server {
    listen 127.0.0.1:8081;
    location = /health { return 200 'ok'; }
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 26m;
    auth_basic "Carbon Urban DSS prototype";
    auth_basic_user_file /etc/nginx/secrets/htpasswd;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        if ($cross_site_write) { return 403; }
        # Docker DNS is refreshed after application container replacement.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_origin frontend:80;
        proxy_pass http://$app_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_hide_header Referrer-Policy;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
