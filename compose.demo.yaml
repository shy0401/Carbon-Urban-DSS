# Use together with compose.yaml. Existing volumes and local ports are preserved.
services:
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  api:
    restart: unless-stopped
  worker:
    restart: unless-stopped
  frontend:
    restart: unless-stopped
  ollama:
    restart: unless-stopped
  gateway:
    image: nginx:stable-alpine
    profiles: [public-demo]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5180:8080"
    volumes:
      - ./deploy/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.secrets/gateway.htpasswd:/etc/nginx/secrets/htpasswd:ro
    depends_on:
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8081/health]
      interval: 5s
      timeout: 3s
      retries: 12
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public-demo]
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, --protocol, http2, --url, http://gateway:8080]
    depends_on:
      gateway: {condition: service_healthy}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
